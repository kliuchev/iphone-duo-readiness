name: CI & Audit Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner regression tests
        run: python3 -B -m unittest discover -s .agents/skills/iphone-duo-readiness/scripts -p 'test_*.py'

      - name: Run scanner smoke test
        run: |
          python3 .agents/skills/iphone-duo-readiness/scripts/analyze_ios_duo.py .
